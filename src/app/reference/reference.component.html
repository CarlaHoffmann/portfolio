<div class="reference-container">
  <h2>{{ t.headline }}</h2>

  <div class="slideshow">
    <div class="slides-wrapper" 
      [style.transform]="wrapperTransform"
      [style.transition]="transition"
      (transitionend)="onTransitionEnd()"
    >
      <!-- <img class="qoutes" src="./assets/icons/quotes.svg" alt="" /> -->

      </div>
  
      <div class="slide current">

      <div class="slide next">

      @for (slide of visibleSlides; track slide.id; let i = $index) {
        <div class="slide" [ngClass]="slide.slideType">
          <div class="slide-card">
            <p>{{ slide.text }}</p>
            <span class="author-line">
              <span class="line"></span>
              <span class="author-name">{{ slide.author }} – {{ slide.position }}</span>
            </span>
          </div>
        </div>
      }

    </div>
  </div>

  <div class="slide-control">
    <img
      src="./assets/icons/arrow-left.svg"
      alt="left"
      (click)="goPrev()"
      class="arrow left"
    />

    @for (slide of slides; track slide; let i = $index) {
    <img
      [src]="
        i === currentIndex
          ? './assets/icons/ellipse-current.svg'
          : './assets/icons/ellipse.svg'
      "
      class="ellipse"
      [class.current-ellipse]="i === currentIndex"
      alt="ellipse"
    />
    }

    <img
      src="./assets/icons/arrow-right.svg"
      alt="right"
      (click)="goNext()"
      class="arrow right"
    />
  </div>
</div>
