<div id="projects" class="projects-container">
    <div class="inner-projects-container">
        <div class="component-header">
            <h2>Portfolio</h2>
            <h1>Featured Projects</h1>
        </div>

        <span class="info">
            Explore a selection of my work here - Interact with <br />projects to see
            my skills in action.
        </span>

        <div class="project-list">
            @for (project of projects; let i = $index; track project.title) {
                <div (click)="openProject(project, i)" class="project">
                    <div class="title-wrapper">
                        <span class="project-title">{{ project.title }}</span>
                        <img src="./assets/icons/arrow_outward.svg" alt="" />
                    </div>
                    <span class="languages">
                        @for (tech of project.technologies; track tech) {
                            {{ tech }} <span class="green" *ngIf="tech !== project.technologies.at(-1)">|</span>
                        }
                    </span>
                    <div class="project-image-wrapper">
                        <div class="project-shadow"></div>
                        <div class="project-image"
                            [style.background-image]="'url(' + project.image + ')'"
                        ></div>
                    </div>
                </div>
            }
        </div>

        <app-project-overlay
            *ngIf="isOverlayOpen && selectedProject"
            [project]="selectedProject"
            [index]="selectedIndex"
            (close)="closeOverlay()"
            (next)="openNextProject()"
        ></app-project-overlay>
    </div>
</div>
