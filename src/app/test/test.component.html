<div class="slideshow">
    <div
      class="slides-wrapper"
      [style.transform]="wrapperTransform"
      [style.transition]="transition"
      (transitionend)="onTransitionEnd()"
    >
      @for (offset of [-1,0,1]; track offset; let idx = $index) {
        <div class="slide"
             [class.current]="offset === 0"
             [class.prev]="offset === -1"
             [class.next]="offset === 1">
          {{ slides[getIndex(currentIndex + offset)] }}
        </div>
      }
    </div>
    <button (click)="prev()" class="nav left">&#8592;</button>
    <button (click)="next()" class="nav right">&#8594;</button>
  </div>
