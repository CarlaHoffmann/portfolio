<div id="skills" class="skill-container">
    <div class="inner-skill-container">
        <div class="text-container">
            <h2>{{ t.technologies }}</h2>
            <div class="text-box">
                <h1>{{ t.skillSet }}</h1>

                <div class="info-box">
                    <div class="info">{{ t.intro }}</div>
                    <div class="text-component">
                        <h3 [innerHTML]="t.needAnotherSkill">You need <span class="green">another skill?</span></h3>
                        <div class="text">{{ t.expandSkills }}</div>
                    </div>
                </div>

                <a href="#contact">
                    <app-slide-btn text="{{ t.letsTalk }}"></app-slide-btn>
                </a>
            </div>
        </div>

        <div class="tech-icon-container">
            <div class="inner-tech-icon-container">
                @for (tech of technologies; track tech.title) {
                    <div class="tech"
                        [class.has-description]="tech.description"
                        (mouseenter)="showDescription(tech)"
                        (mouseleave)="hideDescription()"
                    >
                        <div class="tech-image-wrapper">
                            <img class="tech-image" [src]="tech.image" [alt]="tech.title">
                            
                            <div class="tech-dialog" *ngIf="activeTech === tech">
                                {{ tech.description }}
                            </div>
                        </div>
                        <span>{{ tech.title }}</span>
                    </div>
                }
            </div>
          </div>
    </div>
</div>
